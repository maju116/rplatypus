# The look of both platypus sites. This file is identical in the R package and in pyplatypus,
# line for line, and `rplatypus`'s `tests/testthat/test-brand.R` is what says so: it fetches
# this file from the engine's default branch and compares it line by line - line rather than
# byte, so a CRLF checkout on Windows cannot read as a difference.
#
# That test exists because this comment claimed one and there was none. Renaming the R package
# on 2026-10-14 edited the two copies apart and not one test failed in either suite,
# `maju116/rplatypus#160`. The check lives on the R side alone, for the reason the field-prose
# ledger does: the engine owns the look, so R's copy is the copy.
#
# So change it here and the R suite goes red until R follows. That is the intended direction.
#
# THE PALETTE COMES FROM THE HEXSTICKER, which is the one thing the author asked to keep
# when both repositories were reset (CLAUDE.md §4c). It is measured off the sticker rather
# than chosen, and it has been re-measured twice as the sticker changed - once on
# 2026-10-25 when the drawing was replaced and the colours did not move, and once on the
# same day when the field inside the hexagon went from cream to green and they did.
#
# THE CURRENT SOURCE IS assets/hexsticker_platypus_v3.png in the workbench. Seven clusters
# over its 138,530 opaque pixels, k-means, with a second seed as the control that a centre
# is a colour of the image rather than of the run:
#
#     sage   #d9dbba   37.0%    the field inside the hexagon
#     green  #33442b   12.7%    the border and the lettering
#     brown  #8a7053   11.3%    the platypus
#     tan    #d49d6e   11.3%    its lighter half
#     cream  #faf6dd    5.8%    the inner rim and the flowers
#
# The 2022 mkdocs site set `palette: primary: brown`, and that is what this replaced the
# `#1c5d99` blue in _pkgdown.yml with in September. It is now the green, because the green
# is what the sticker draws its border and its own name in - and because of the constraint
# below, which is what actually decides.
#
# CONTRAST IS A CONSTRAINT HERE, NOT A PREFERENCE. Measured against white, for the 4.5
# WCAG AA needs for body text:
#
#     green      #33442b   10.5   links, text, anything small
#     brown      #8a7053    4.6   clears 4.5, but it is the floor rather than comfort
#     tan        #d49d6e    2.4   decoration only
#     sage       #d9dbba    1.4   background only
#     cream      #faf6dd    1.1   a tint, and barely that
#
# So `primary` is the green: it is the only colour here with room to spare, at 10.5 against
# the brown the sticker used to supply at 11.8 - the same class, which is why links do not
# get harder to read for this change. The brown is `secondary` and must not carry body text
# at 4.6 however legal that is, and the tan is still the prettiest colour in the sticker and
# still must not carry a link.
#
# `terracotta` is gone rather than recoloured. There is nothing in its region of v3 at all -
# the platypus is muted now - so keeping the key would have meant inventing a colour to fill
# it. `ink` is deliberately NOT taken from the sticker: v3's darkest cluster is an olive
# black at 15.4, and adopting it would tint every word on both sites.
#
# THE TABLE THIS REPLACES WAS WRONG IN THREE OF ITS FOUR NUMBERS and had been since it was
# written: brown 11.8 against 12.7, terracotta 3.7 against 3.4, tan 2.6 against 2.4, with
# only cream's 1.3 right. Every conclusion drawn from it survives - brown was still the
# highest, terracotta still above 3.0, tan still below it - which is why nothing caught it.
# A contrast ratio is a measured number in prose with nothing holding it, which is what
# CLAUDE.md §3C is a rule about, so `tests/test_brand_contrast.py` now reads this table out
# of this file and recomputes every row. Its own control is the four values the WCAG
# definition fixes: black 21.00, white 1.00, #767676 4.54, #595959 7.00.

meta:
  name: platypus
  link:
    home: https://maju116.github.io/rplatypus/
    github: https://github.com/maju116/rplatypus

color:
  palette:
    green: "#33442b"
    brown: "#8a7053"
    tan: "#d49d6e"
    sage: "#d9dbba"
    cream: "#faf6dd"
    ink: "#3d3636"
  foreground: ink
  background: white
  primary: green
  secondary: brown
  # `light` is the tint behind a callout or a table head, where nothing is small enough for
  # contrast to matter. It is the sage rather than the cream: the cream is 1.1 against white,
  # which is not a tint but a rounding error, where the sage is the sticker's own field.
  light: sage
  dark: ink

typography:
  fonts:
    - family: Source Sans 3
      source: google
    - family: JetBrains Mono
      source: google
  base:
    family: Source Sans 3
    line-height: 1.6
  headings:
    family: Source Sans 3
    weight: 600
  monospace:
    family: JetBrains Mono
    size: 0.9em
  link:
    color: brown
    decoration: underline
