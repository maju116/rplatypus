# The look of both platypus sites. This file is identical in the R package and in pyplatypus,
# line for line, and `rplatypus`'s `tests/testthat/test-brand.R` is what says so: it fetches
# this file from the engine's default branch and compares it line by line - line rather than
# byte, so a CRLF checkout on Windows cannot read as a difference.
#
# That test exists because this comment claimed one and there was none. Renaming the R package
# on 2026-10-14 edited the two copies apart and not one test failed in either suite,
# `maju116/rplatypus#160`. The check lives on the R side alone, for the reason the field-prose
# ledger does: the engine owns the look, so R's copy is the copy.
#
# So change it here and the R suite goes red until R follows. That is the intended direction.
#
# THE PALETTE COMES FROM THE HEXSTICKER, which is the one thing the author asked to keep
# when both repositories were reset (CLAUDE.md §4c). Measured off the sticker of the day -
# the workbench's assets/hexsticker_platypus_v1.png - rather than chosen: cream is 54.8% of
# its opaque pixels, the dark brown 12.1%, tan 9.1%, terracotta 4.1%. The 2022 mkdocs site
# set `palette: primary: brown`, so this is a return to the author's own choice rather than
# an invention - and it replaces the `#1c5d99` blue that was typed into _pkgdown.yml in
# September and matched nothing.
#
# THE STICKER WAS REPLACED ON 2026-10-25 AND THESE COLOURS DID NOT MOVE, which is a
# measurement and not an assumption. The percentages above are kept as they were written,
# against the file now named v1, because re-deriving them with a different tolerance would
# silently restate a number nobody re-measured. What was measured is the comparison, both
# stickers the same way - the share of opaque pixels within a distance of 40 of each brand
# colour:
#
#     old sticker   brown 20.3%   terracotta  6.5%   tan 12.4%   cream 57.2%
#     new sticker   brown 22.1%   terracotta 15.3%   tan 11.6%   cream 44.6%
#
# Cream falls twelve points and terracotta rises nine, because the platypus is bigger and
# the field behind it smaller. The ROLES are what this file encodes and they are unchanged:
# cream is still the most common colour and so still the background, and brown is still the
# only one of the four that clears 4.5 against white, so it still carries every link.
#
# CONTRAST IS A CONSTRAINT HERE, NOT A PREFERENCE. Measured against white, for the 4.5
# WCAG AA needs for body text:
#
#     brown      #53251d   11.8   links, text, anything small
#     terracotta #c5785c    3.7   large text only
#     tan        #de986d    2.6   decoration only
#     cream      #f4e0c0    1.3   background only
#
# Tan is the prettiest colour in the sticker and must not carry a link. That is why
# `primary` is the brown.

meta:
  name: platypus
  link:
    home: https://maju116.github.io/rplatypus/
    github: https://github.com/maju116/rplatypus

color:
  palette:
    brown: "#53251d"
    terracotta: "#c5785c"
    tan: "#de986d"
    cream: "#f4e0c0"
    ink: "#3d3636"
  foreground: ink
  background: white
  primary: brown
  secondary: terracotta
  # `light` is the tint behind a callout or a table head, where nothing is small enough for
  # contrast to matter.
  light: cream
  dark: ink

typography:
  fonts:
    - family: Source Sans 3
      source: google
    - family: JetBrains Mono
      source: google
  base:
    family: Source Sans 3
    line-height: 1.6
  headings:
    family: Source Sans 3
    weight: 600
  monospace:
    family: JetBrains Mono
    size: 0.9em
  link:
    color: brown
    decoration: underline
