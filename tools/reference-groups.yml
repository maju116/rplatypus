# The reference, grouped by what a person is doing - the one piece of this site that is a
# judgement rather than a derivation, which is why it lives in a file of its own.
#
# It was `_pkgdown.yml`'s `reference:` section until 2026-10-07. pkgdown is gone, and
# keeping its configuration file as the source of a Quarto sidebar would have been a fact
# in a place that no longer explains itself.
#
# `tools/build-reference.R` turns this into the sidebar in `altdoc/quarto_website.yml`, and
# `tests/testthat/test-reference-groups.R` asserts every exported topic appears in exactly
# one group - which is what `check_pkgdown()` used to do and what adding a function and
# forgetting the index used to break.

groups:
  - title: Setting up
    desc: >
      The engine is Python, installed on first use. These three say where it is, what it
      found, and which build of PyTorch to ask for.
    contents: [platypus_status, platypus_device, platypus_use_torch]

  - title: A specification
    desc: >
      One object says what to train, on what data, with what. Built from arguments or from
      YAML - the same specification either way.
    contents: [platypus_spec, segmentation_data, detection_data, instance_data, models,
               yolo3, save_spec, as.list.platypus_spec]

  - title: What a model is made of
    desc: >
      Losses, metrics, optimisers, callbacks, augmentation, encoders - and the listings that
      ask the engine what those names are, rather than asking you to remember them.
    contents: [losses, loss_boundary, metrics, optimizers, callbacks, callback_swa,
               separations, decodings, augmentation_step, available_components,
               available_transforms, encoders]

  - title: The data on disk
    desc: >
      Splitting by patient rather than by slice, and looking at what is actually there
      before spending an afternoon training on it.
    contents: [split_dataset, split_path, read_images, read_masks, volume_info,
               series_report, inspect_masks]

  - title: Training
    desc: >-
      Fitting, and what the run says while and after it happens - one row per epoch, and a
      figure of it.
    contents: [platypus_fit, training_history, plot.platypus_fit]

  - title: Predicting and scoring
    desc: >-
      Masks and boxes out, and the numbers that say whether to believe them: over a dataset,
      per case, per class, per image.
    contents: [predict.platypus_fit, evaluate, evaluate_cases, evaluate_classes,
               evaluate_images, detection_anchors, detection_crops]

  - title: Weights
    desc: >-
      Published weights, and your own. A registry name carries the commit it was published
      at, so one name means one set of numbers for good.
    contents: [export_weights, available_weights]

  # Between "Weights" and "Looking at the results", which is where the engine files it and
  # where the shared order has always put it. It held nothing on this side until 2026-10-11:
  # the engine wrote records from the beginning and R had no way to read one, so the package's
  # own tests reached for `jsonlite::fromJSON()` to check that a detector's fitted anchors had
  # been written down.
  - title: Records
    desc: >-
      What a run wrote down about itself, including the engine version that made it. Reading
      one needs no Python: a record you cannot read without the thing that wrote it is worth
      less than one you can.
    contents: [read_record]

  - title: Looking at the results
    desc: A figure is the point. These are the ones you put in a paper.
    contents: [plot_masks, plot_boxes, plot_anchors, overlay_mask, overlay_agreement,
               overlay_instances, overlay_instance_agreement, flow_to_colours,
               drawing_style]

  - title: Masks and volumes
    desc: >-
      Reading masks, joining them, measuring them and writing them back. Millilitres rather
      than voxels, and a NIfTI that carries the affine of the scan it was predicted from.
    contents: [colours_to_classes, classes_to_colours, mask_coverage, mask_volume,
               unite_masks, colormaps, ct_windows, save_masks, save_class_masks,
               save_volumes, save_class_volumes, instance_sizes]

  # Last here and last in the engine's grouping too, because it is the page a reader reaches
  # after something has gone wrong rather than while planning what to do. The group existed
  # on the engine's side alone until 2026-10-11: the conditions were raised and classed from
  # the beginning and documented nowhere, so the one thing a script needs in order to handle
  # a failure was discoverable only by reading `R/errors.R`.
  - title: When something is wrong
    desc: >-
      Every failure arrives as a classed condition, so a script can tell a specification it
      cannot run from a dataset that is not there. `platypus_error` catches all of them.
    contents: [platypus_conditions]

  # Last, and the one group here that is not about the package. The family is named after the
  # animal; this is the only page that is about the animal. The title went into the shared
  # order in pyplatypus's tests/test_reference_groups.py at the same time, which is what that
  # order is for: it is an agreement about where a group goes, not a list both sides fill, so
  # the engine carries the title with no contents exactly as this package does for `Records`.
  - title: The animal
    desc: >-
      The package is named after a monotreme, and this says something true about it. A fact
      is also printed when the package is attached, which can be turned off.
    contents: [platypus_fact]
