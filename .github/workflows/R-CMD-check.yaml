name: R-CMD-check

on:
  push:
    branches: [main, master, new-release, "rewrite/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: read-all

jobs:
  # Deliberately without Python. This is how CRAN sees the package and how most users
  # first meet it: everything needing the engine must skip, cleanly, and the check must
  # still pass. It is the more important of the two jobs below.
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}
    # A CEILING, BECAUSE WITHOUT ONE A HUNG JOB RUNS TO GITHUB'S 360-MINUTE DEFAULT.
    # `maju116/pyplatypus#457`: the reviewer's sixteenth pass saw the engine's suite deadlock
    # once at a two-worker detection test - the main process asleep, both children at zero
    # CPU, `utime` unmoved across two reads - and nothing in either repository set a timeout.
    #
    # 45 minutes is set against the WORST DAY SEEN rather than the typical one, which is the
    # mistake this figure invites in both directions: too low turns a slow runner into a
    # false red, too high is the default. Measured over the last 30 workflow runs of each
    # repository, the longest job is 11.8 minutes in `pyplatypus` and 7.6 in `rplatypus` -
    # and §7 of the workbench records `setup-r@v2` alone taking 22m55s once, OUTSIDE that
    # window, which is why the ceiling is set against that outlier rather than against the
    # sample. A sample of thirty runs understates the worst day by construction.
    timeout-minutes: 45
    name: ${{ matrix.config.os }} (R ${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        config:
          - { os: ubuntu-latest,  r: 'devel', http-user-agent: 'release' }
          - { os: ubuntu-latest,  r: 'release' }
          - { os: ubuntu-latest,  r: 'oldrel-1' }
          - { os: macos-latest,   r: 'release' }
          - { os: windows-latest, r: 'release' }

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      # `_R_CHECK_CRAN_INCOMING_` IS DELIBERATELY NOT SET HERE, and the reason is a
      # measurement rather than a preference. `check-r-package@v2` runs, before
      # `rcmdcheck`, a line that sets that variable to the string `false` whenever it is
      # empty - and `tools:::.check_packages` consults `--as-cran` for the *CRAN incoming
      # feasibility* section ONLY when the variable is unset, taking the variable's own
      # value otherwise. So this job runs `--as-cran` with that section skipped, which is
      # what `maju116/rplatypus#322` is about: three documents said otherwise.
      #
      # Setting it to `true` was tried and made the gate WORSE, in CI, on this very
      # workflow. The section needs CRAN's own package database, and from a GitHub runner
      # the fetch of `https://CRAN.R-project.org/src/contrib/PACKAGES.in` timed out at 60
      # seconds, `read.dcf` could not open the connection, and `R CMD check` printed
      # `Execution halted`. `rcmdcheck` then reported success:
      #
      #     the section on, in CI          7 checking steps, NO Status: line, job GREEN
      #     the section on, locally       50 checking steps, Status: 2 NOTEs, 38 s of URLs
      #     the section off (this job)    48 checking steps, Status: 1 NOTE
      #
      # So on a runner it does not check more, it checks SEVEN STEPS AND STOPS - and the
      # package's tests, examples and everything after step seven are never reached.
      # `_R_CHECK_CRAN_INCOMING_REMOTE_: false` avoids the network and the halt, and buys
      # nothing worth having: `if (localOnly) return(out)` sits before both the database
      # fetch and the URL checks, so the version comparison and the URLs - the two things
      # anybody would turn this on for - are on the far side of it. Measured: that arm adds
      # one NOTE naming the maintainer.
      #
      # What catches the version and the URLs is the local `--as-cran` run before a
      # submission, which §7 carries, and CRAN's own pretest, which refuses loudly within
      # minutes. What catches a WARNING anywhere else - `codetools` undeclared, the case
      # §8 records - is this job, unchanged.

    steps:
      - uses: actions/checkout@v7

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          # NO `args` OVERRIDE, which is the whole of `maju116/rplatypus#316`. This step
          # used to pass `c("--no-manual")` to drop `--as-cran`, and the reason it gave was
          # that the name clash with the archived CRAN package `Platypus` is an error under
          # that flag "and is being taken up with CRAN separately". That ended: the package
          # was renamed on 2026-10-14 and accepted on 2026-11-04, so there is no clash and
          # nothing is being taken up with anybody.
          #
          # The action's own default is already `c("--no-manual", "--as-cran")`, so the
          # repair is deleting the override rather than adding anything - and its
          # `error-on` default is `"warning"`, which is what makes this a gate rather than
          # an upload nobody reads: it fails on a WARNING or an ERROR and NOT on a NOTE.
          #
          # WHAT THIS GATE IS, EXACTLY, because the first version of this comment claimed
          # more: `--as-cran` **minus** the CRAN-incoming section, which the action switches
          # off and the `env:` above explains. It had said that `--as-cran` "always emits
          # NOTEs here" naming `Maintainer` and `Days since last update`, and this job emits
          # neither - they come from the section that does not run. `maju116/rplatypus#322`.
          #
          # What it buys, measured rather than argued: `CLAUDE.md` §8 records five days,
          # 2026-10-29 to 2026-11-03, when `--as-cran` carried a WARNING - `codetools` used
          # by `::` and undeclared - and nothing said so. CRAN does not accept a WARNING and
          # `main` is the submission candidate, so a submission on any of those days would
          # have been sent back. No gate run before a push asked that question.
          #
          # Vignettes are built here on purpose. They are precomputed, so building them
          # runs no model and needs no Python - and skipping the build is not free: it
          # leaves inst/doc empty, which R CMD check reports as two WARNINGs, which this
          # action then fails on. Checking a package differently from how it is shipped
          # only produces failures that say nothing.

      # A CHECK THAT DIES BEFORE ITS VERDICT READS AS A CLEAN CHECK, which is what `#322`
      # found by making one die: `rcmdcheck` reported `conclusion=success` over a log with
      # seven `* checking` lines and no `Status:` at all, so the job was green and nothing
      # in the package had been checked past step seven. That is §4's own warning - a step
      # with no repair chained to a check whose result nobody reads - and it is not about
      # the incoming section, which merely supplied a reason to die.
      #
      # So the verdict is asserted to exist. Absence of `00check.log` is a failure too,
      # because a missing log and a log with no verdict are the same silence.
      - name: The check has to have reached a verdict
        shell: bash
        run: |
          log=$(find check -name '00check.log' -print -quit 2>/dev/null)
          if [ -z "$log" ]; then
            echo "no 00check.log anywhere under check/ - the check left no log to read"
            exit 1
          fi
          if ! grep -qE '^Status:' "$log"; then
            echo "$log has no Status: line, so R CMD check stopped before its verdict."
            echo "Steps it did reach: $(grep -cE '^\* checking' "$log")"
            tail -40 "$log"
            exit 1
          fi
          echo "$log says: $(grep -E '^Status:' "$log")"

  # Style and the defects a linter finds, in both languages the package is written in.
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    name: lint

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v7

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      # The package itself, not just lintr: `object_usage_linter` resolves every name
      # against the package's namespace, and against a stale install it reports live
      # helpers as undefined - which is how three real functions were first flagged here.
      # It is the one linter in the set that finds defects rather than style, so it has to
      # be looking at the code in front of it.
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::lintr, any::yaml, local::.
          needs: lint

      - name: Lint the R sources
        run: lintr::lint_package()
        shell: Rscript {0}
        env:
          LINTR_ERROR_ON_LINT: true

      # `inst/python/platypus_shim.py` is the one Python file here and it had never been
      # linted or formatted by anything: the engine's ruff covers the engine's repository,
      # and this one had no Python tooling at all. Two real findings came out of switching
      # it on - a `subprocess.run` with no `check=` argument and an unsorted import block.
      #
      # Pinned to the version pyproject.toml pins over in pyplatypus, so a contributor's
      # machine, that repository and this one cannot disagree about the rules. ruff.toml
      # carries the one setting that is not a default.
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      # The version is the one `pyproject.toml` pins in the engine, and it is written here
      # because this repository has no pyproject of its own to read it from. That makes it a
      # second copy of one fact with nothing holding the two together: a ruff bump over there
      # desynchronises the rules over here, silently, until the first new rule fires. The
      # engine's bump to 0.17.2 is `maju116/pyplatypus#283` and this travels with it in the
      # same sitting rather than afterwards.
      - run: uvx ruff@0.17.3 check inst/python
      - run: uvx ruff@0.17.3 format --check --diff inst/python

      # The issue forms and the pull-request template, held to the shape pyplatypus shares.
      # Here rather than in `tests/testthat/` because `.github` is in `.Rbuildignore`: a test
      # reading it would skip under `R CMD check`, and the skip count is the signal that two
      # other gates depend on. The engine has no tarball, so over there it is a plain test.
      #
      # It earns its place: the templates it checks asked reporters for a **TensorFlow
      # version** until 2026-10-11, in a package that has been on torch since the rewrite,
      # and this one named a function it does not have.
      - name: Check the GitHub templates
        run: Rscript tools/check-github-templates.R

  # The bridge, exercised for real. This is the part most likely to break in a way local
  # work would not reveal: it downloads the engine into a fresh managed environment, the
  # same way a user's first call does.
  engine:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    name: engine (bridge to pyplatypus)

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      PLATYPUS_TEST_ENGINE: 'true'

    steps:
      - uses: actions/checkout@v7

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      # reticulate downloads uv itself if it is missing, but having it cached here saves
      # doing that on every run.
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::testthat, local::.
          needs: check

      - name: Report what the engine resolved to
        run: |
          Rscript -e 'library(rplatypus); print(platypus_status()); print(platypus_device())'

      - name: Run the tests, engine included
        run: |
          Rscript -e '
            library(testthat); library(rplatypus)
            results <- as.data.frame(test_dir("tests/testthat", reporter = "summary"))

            failed <- sum(results$failed) + sum(results$error)
            skipped <- sum(results$skipped)
            cat("\nfailed:", failed, " skipped:", skipped, "\n")

            if (failed > 0) stop("tests failed")

            # A silent skip would turn this job into an expensive way of proving that R
            # starts, which the matrix above already proves. If the engine did not come
            # up, this job has to say so rather than pass.
            if (skipped > 0) stop("engine tests were skipped; the bridge was not exercised")
          '
